{
	"name": "Publish reviewed Flow stable cursor optimizations",
	"on": {
		"push": {
			"branches": [
				"perf/flow-stable-cursors-reused-roots-20261121"
			],
			"paths": [
				".github/workflows/flow-phase3-apply.yml"
			]
		}
	},
	"permissions": {
		"contents": "write"
	},
	"jobs": {
		"apply": {
			"runs-on": "ubuntu-latest",
			"steps": [
				{
					"uses": "actions/checkout@v5",
					"with": {
						"persist-credentials": true,
						"submodules": false
					}
				},
				{
					"uses": "shivammathur/setup-php@v2",
					"with": {
						"php-version": "8.4",
						"coverage": "none",
						"extensions": "dom,xml"
					}
				},
				{
					"uses": "actions/setup-node@v4",
					"with": {
						"node-version": "22"
					}
				},
				{
					"name": "Check SHA-256 and apply exact source patch",
					"run": "node - <<'JS'\nconst fs = require('fs');\nconst zlib = require('zlib');\nconst crypto = require('crypto');\nconst child = require('child_process');\nconst parts = [1, 2, 3, 4, 5, 6];\nconst encoded = parts.map(n => fs.readFileSync('.github/flow-phase3.part' + n, 'utf8')).join('');\nif (encoded.length !== 16248) {\n\tthrow new Error('Invalid encoded patch size: ' + encoded.length);\n}\nconst patch = zlib.brotliDecompressSync(Buffer.from(encoded, 'base64'));\nconst hash = crypto.createHash('sha256').update(patch).digest('hex');\nif (hash !== '62a23cb1a4830fe84a194be63387430742910ceeee47e282132121a7cad6f31f') {\n\tthrow new Error('SHA-256 verification failed: ' + hash);\n}\nchild.execFileSync('git', ['apply', '--check', '-'], {input:patch, stdio:['pipe','inherit','inherit']});\nchild.execFileSync('git', ['apply', '-'], {input:patch, stdio:['pipe','inherit','inherit']});\nconsole.log('Verified and applied ' + patch.length + ' bytes (' + hash + ')');\nJS"
				},
				{
					"name": "Run complete targeted regressions and syntax checks",
					"run": "set -eu\nphp extensions/Flow/tests/smoke/FlowCacheTest.php\nphp extensions/Flow/tests/smoke/FlowFormatterOptimizationTest.php\nphp extensions/Flow/tests/smoke/FlowContentFixerTest.php\nphp extensions/Flow/tests/smoke/FlowPrefetchedRootsTest.php\nphp extensions/Flow/tests/smoke/FlowUpdatedCursorTest.php\nnode extensions/Flow/tests/smoke/flow-loadmore.test.js\nnode extensions/Flow/tests/smoke/flow-pagination.test.js\nPYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s extensions/Flow/tests/smoke -p 'test_*.py' -v\nfind extensions/Flow -type f -name '*.php' -not -path '*/vendor/*' -print0 | xargs -0 -n 1 php -l >/tmp/flow-php-lint.log\nfind extensions/Flow/modules -type f -name '*.js' -print0 | xargs -0 -n 1 node --check\ngit diff --check\necho \"PHP and JS syntax passed\""
				},
				{
					"name": "Publish only reviewed changes, drop temporary patch files",
					"run": "set -eu\ngit rm .github/flow-phase3.part1 .github/flow-phase3.part2 .github/flow-phase3.part3 .github/flow-phase3.part4 .github/flow-phase3.part5 .github/flow-phase3.part6\ngit add -A extensions/Flow .github/workflows/flow-checks.yml\ngit diff --cached --check\ngit config user.name 'github-actions[bot]'\ngit config user.email '41898282+github-actions[bot]@users.noreply.github.com'\ngit commit -m \"Flow: reuse root revisions and use stable composite topic cursors\"\ngit push origin HEAD:refs/heads/perf/flow-stable-cursors-reused-roots-20261121"
				}
			]
		}
	}
}
