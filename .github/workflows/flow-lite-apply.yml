{
	"name": "Apply verified experimental Flow lightweight patch",
	"on": {
		"push": {
			"branches": [
				"feature/flow-light-topiclist-20261121"
			],
			"paths": [
				".github/workflows/flow-lite-apply.yml"
			]
		}
	},
	"permissions": {
		"contents": "write"
	},
	"jobs": {
		"apply": {
			"if": "github.actor != 'github-actions[bot]'",
			"runs-on": "ubuntu-latest",
			"steps": [
				{
					"uses": "actions/checkout@v5",
					"with": {
						"persist-credentials": true,
						"submodules": false
					}
				},
				{
					"uses": "shivammathur/setup-php@v2",
					"with": {
						"php-version": "8.4",
						"coverage": "none",
						"tools": "composer:v2"
					}
				},
				{
					"uses": "actions/setup-node@v4",
					"with": {
						"node-version": "22"
					}
				},
				{
					"name": "Verify and apply reviewed source patch",
					"run": "python3 - <<'PY'\nimport base64, zlib, hashlib, subprocess\nfrom pathlib import Path\nraw=zlib.decompress(base64.b64decode(Path('.github/flow-lite-bundle.b64').read_text()))\nassert hashlib.sha256(raw).hexdigest() == 'a3463789f777c5f064b950377ecd9dbc2b6713e7dd4b6c6ff32c0bb9a4533c93'\nsubprocess.run(['git','apply','--check','-'],input=raw,check=True)\nsubprocess.run(['git','apply','-'],input=raw,check=True)\nprint('Applied checksum-verified patch with',len(raw),'bytes')\nPY"
				},
				{
					"name": "Generate server-side compiled Handlebars with pinned farm LightnCandy 1.2.6",
					"run": "set -eu\nmkdir -p /tmp/flow-lightcandy\ncomposer require --working-dir=/tmp/flow-lightcandy --no-interaction --no-progress --no-scripts 'zordius/lightncandy:1.2.6'\nphp -r 'require \"/tmp/flow-lightcandy/vendor/autoload.php\"; require \"extensions/Flow/includes/TemplateHelper.php\"; $h = new \\Flow\\TemplateHelper(\"extensions/Flow/handlebars\", true); $h->getTemplate(\"flow_block_topiclist\"); $h->getTemplate(\"flow_block_topic\");'\ngrep -q \"flow_topic_preview\" extensions/Flow/handlebars/compiled/flow_block_topiclist.handlebars.php\ngrep -q \"flow_topic_preview\" extensions/Flow/handlebars/compiled/flow_block_topic.handlebars.php"
				},
				{
					"name": "Run PHP 8.4, JavaScript and regression tests",
					"run": "set -eu\nphp -l extensions/Flow/includes/Block/TopicListBlock.php\nphp -l extensions/Flow/includes/View.php\nphp -l extensions/Flow/handlebars/compiled/flow_block_topiclist.handlebars.php\nphp -l extensions/Flow/handlebars/compiled/flow_block_topic.handlebars.php\nphp extensions/Flow/tests/smoke/FlowCacheTest.php\nphp extensions/Flow/tests/smoke/FlowLightTopicListTest.php\nnode --check extensions/Flow/modules/engine/components/board/features/flow-board-loadmore.js\nnode --check extensions/Flow/modules/flow-initialize.js\nnode extensions/Flow/tests/smoke/flow-loadmore.test.js\nnode extensions/Flow/tests/smoke/flow-light-topic.test.js\nPYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s extensions/Flow/tests/smoke -p 'test_*.py' -v"
				},
				{
					"name": "Commit verified feature code without transport bootstrap",
					"run": "set -eu\nrm .github/flow-lite-bundle.b64 .github/workflows/flow-lite-apply.yml\ngit add -A .github extensions/Flow\ngit diff --cached --check\ngit config user.name 'github-actions[bot]'\ngit config user.email '41898282+github-actions[bot]@users.noreply.github.com'\ngit commit -m \"Flow: add opt-in lightweight board preview and lazy topic hydration\"\ngit push origin HEAD:refs/heads/feature/flow-light-topiclist-20261121\n"
				}
			]
		}
	}
}
