name: Pinned dependencies audit

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'
  pull_request:
    paths:
      - '.gitmodules'
      # A gitlink is a changed path at the first level of extensions/ or skins/.
      - 'extensions/*'
      - 'skins/*'
      - 'extensions/CrawlerProtection/build'
      - 'tests/ci/auditPinnedDependencies.py'
      - '.github/workflows/pinned-dependencies-audit.yml'
  push:
    branches:
      - main
    paths:
      - '.gitmodules'
      # A gitlink is a changed path at the first level of extensions/ or skins/.
      - 'extensions/*'
      - 'skins/*'
      - 'extensions/CrawlerProtection/build'
      - 'tests/ci/auditPinnedDependencies.py'
      - '.github/workflows/pinned-dependencies-audit.yml'

permissions:
  contents: read

jobs:
  gitlinks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: false
      - name: Verify local inventory offline
        run: |
          python3 -m py_compile tests/ci/auditPinnedDependencies.py
          python3 tests/ci/auditPinnedDependencies.py --offline
      - name: Compare pinned gitlinks with tracked upstream branch heads
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tests/ci/auditPinnedDependencies.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pinned-dependency-inventory
          path: submodule-audit.json
