{
	"name": "Interlanguage PHP checks",
	"on": {
		"push": {
			"branches": [
				"main"
			],
			"paths": [
				"extensions/Interlanguage",
				"extensions/Interlanguage/**",
				".gitmodules",
				".github/workflows/interlanguage-php-checks.yml",
				"tests/ci/interlanguage-integration.sh"
			]
		},
		"pull_request": {
			"paths": [
				"extensions/Interlanguage",
				"extensions/Interlanguage/**",
				".gitmodules",
				".github/workflows/interlanguage-php-checks.yml",
				"tests/ci/interlanguage-integration.sh"
			]
		},
		"workflow_dispatch": null
	},
	"permissions": {
		"contents": "read"
	},
	"jobs": {
		"interlanguage": {
			"runs-on": "ubuntu-24.04",
			"timeout-minutes": 35,
			"services": {
				"mariadb": {
					"image": "mariadb:10.11",
					"env": {
						"MARIADB_ROOT_PASSWORD": "ci-only-disposable-db"
					},
					"ports": [
						"3306:3306"
					],
					"options": "--health-cmd=\"healthcheck.sh --connect --innodb_initialized\" --health-interval=10s --health-timeout=5s --health-retries=12"
				}
			},
			"steps": [
				{
					"uses": "actions/checkout@v5",
					"with": {
						"persist-credentials": false,
						"submodules": false
					}
				},
				{
					"name": "Initialize only the pinned public dependencies",
					"run": "set -euo pipefail\nexpected=$(git ls-files --stage -- extensions/Interlanguage | awk '$1 == \"160000\" {print $2}')\ntest -n \"$expected\"\ngit submodule update --init --depth 1 -- extensions/Interlanguage\ntest \"$(git -C extensions/Interlanguage rev-parse HEAD)\" = \"$expected\"\ntest -z \"$(git -C extensions/Interlanguage status --porcelain)\"\ngit -c 'url.https://github.com/.insteadOf=git@github.com:' submodule update --init --depth 1 -- skins/Vector"
				},
				{
					"uses": "shivammathur/setup-php@v2",
					"with": {
						"php-version": "8.4",
						"coverage": "none",
						"extensions": "mysqli, intl, mbstring",
						"tools": "composer:v2"
					}
				},
				{
					"name": "Install the farm's pinned Composer dependencies",
					"run": "composer install --no-interaction --prefer-dist --no-progress"
				},
				{
					"name": "Check integration shell syntax",
					"run": "bash -n tests/ci/interlanguage-integration.sh"
				},
				{
					"name": "Run real FR/EN integration",
					"env": {
						"INTERLANGUAGE_CI_DB_PASSWORD": "ci-only-disposable-db"
					},
					"run": "bash tests/ci/interlanguage-integration.sh"
				}
			]
		}
	},
	"concurrency": {
		"group": "${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}",
		"cancel-in-progress": "${{ github.event_name == 'pull_request' }}"
	}
}
