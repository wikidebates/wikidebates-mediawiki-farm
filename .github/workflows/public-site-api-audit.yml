name: FR and EN public MediaWiki API read-only audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tests/ci/publicSiteVersionAudit.py'
      - '.github/workflows/public-site-api-audit.yml'
      - 'docs/wikidebates-public-site-readonly.md'

permissions:
  contents: read

jobs:
  public-siteinfo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            tests/ci/publicSiteVersionAudit.py
      - name: Validate read-only audit Python
        run: python3 -m py_compile tests/ci/publicSiteVersionAudit.py
      - name: Query public FR/EN MediaWiki siteinfo (no auth, no writes)
        run: python3 tests/ci/publicSiteVersionAudit.py --strict
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: wikidebates-public-siteinfo-audit
          path: wikidebates-public-site-audit.json
