name: Interlanguage PHP checks

on:
  push:
    branches:
      - wikidebates-REL1_43-stable-2026-07-09
      - main
    paths:
      - 'extensions/Interlanguage/**'
      - '.github/workflows/interlanguage-php-checks.yml'
  pull_request:
    paths:
      - 'extensions/Interlanguage/**'
      - '.github/workflows/interlanguage-php-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interlanguage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: sqlite3, pdo_sqlite
      - name: Lint active Interlanguage files
        run: |
          find extensions/Interlanguage -type f -name '*.php' -print0 |
            xargs -0 -n 1 php -l
      - name: Base isolated regression test
        run: php extensions/Interlanguage/tests/InterlanguageSmokeTest.php
      - name: API isolated regression test
        run: php extensions/Interlanguage/tests/InterlanguageApiSmokeTest.php
      - name: Database isolated regression test
        run: php extensions/Interlanguage/tests/InterlanguageDatabaseSmokeTest.php
      - name: Parser isolated regression test
        run: php extensions/Interlanguage/tests/InterlanguageParserSmokeTest.php
      - name: Central isolated regression test
        run: php extensions/Interlanguage/tests/InterlanguageCentralSmokeTest.php
      - name: Purge isolated regression test
        run: php extensions/Interlanguage/tests/InterlanguagePurgeSmokeTest.php
      - name: Pagination isolated regression test
        run: php extensions/Interlanguage/tests/InterlanguagePaginationSmokeTest.php
      - name: Pagination real SQLite regression test
        run: php extensions/Interlanguage/tests/InterlanguagePaginationSqlSmokeTest.php
      - name: Central-wiki replica pagination SQL test
        run: php extensions/Interlanguage/tests/InterlanguageForeignPaginationSqlSmokeTest.php
