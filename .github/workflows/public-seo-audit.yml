name: Public SEO indexes and homepages (read-only)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tests/ci/publicSeoAudit.py'
      - 'tests/ci/testPublicSeoAudit.py'
      - 'tests/ci/robotsPolicy.py'
      - 'tests/ci/nativeSeoAudit.py'
      - 'tests/ci/testNativeSeoAudit.py'
      - 'tests/ci/interlanguageMappingAudit.py'
      - 'tests/ci/testInterlanguageMappingAudit.py'
      - '.github/workflows/public-seo-audit.yml'
      - 'docs/wikidebates-seo-rollout.md'
permissions:
  contents: read
jobs:
  public-seo:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: |
            tests/ci/publicSeoAudit.py
            tests/ci/testPublicSeoAudit.py
            tests/ci/robotsPolicy.py
            tests/ci/nativeSeoAudit.py
            tests/ci/testNativeSeoAudit.py
            tests/ci/interlanguageMappingAudit.py
            tests/ci/testInterlanguageMappingAudit.py
      - name: Offline contract tests
        run: python3 -m unittest discover -s tests/ci -p 'testPublicSeoAudit.py'
      - name: Offline language mapping contract tests and embedded PHP syntax
        run: |
          set -o pipefail
          python3 -m unittest discover -s tests/ci -p 'testInterlanguageMappingAudit.py'
          PYTHONPATH=tests/ci python3 -c 'from interlanguageMappingAudit import PHP; print(PHP)' | php -l
      - name: Offline native SEO audit contracts
        run: python3 -m unittest discover -s tests/ci -p 'testNativeSeoAudit.py'
      - name: Bounded public language mapping observation
        run: python3 tests/ci/interlanguageMappingAudit.py --public
      - name: Bounded public observations and namespace inventory
        run: python3 tests/ci/publicSeoAudit.py --namespace-inventory --all-homepages --editorial-inventory --shared-assets
      - name: Observe fixed native SEO samples (informational before deployment)
        run: python3 tests/ci/nativeSeoAudit.py
