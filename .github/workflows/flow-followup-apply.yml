{
	"name": "Apply verified Flow follow-up patch",
	"on": {
		"push": {
			"branches": [
				"fix/flow-followup-no-lazy-20261121"
			],
			"paths": [
				".github/workflows/flow-followup-apply.yml"
			]
		}
	},
	"permissions": {
		"contents": "write"
	},
	"jobs": {
		"apply": {
			"runs-on": "ubuntu-latest",
			"steps": [
				{
					"uses": "actions/checkout@v5",
					"with": {
						"persist-credentials": true,
						"submodules": false
					}
				},
				{
					"uses": "shivammathur/setup-php@v2",
					"with": {
						"php-version": "8.4",
						"coverage": "none",
						"extensions": "dom,xml"
					}
				},
				{
					"uses": "actions/setup-node@v4",
					"with": {
						"node-version": "22"
					}
				},
				{
					"name": "Verify and apply reviewed source patch",
					"run": "node - <<'JS'\nconst fs = require('fs');\nconst zlib = require('zlib');\nconst crypto = require('crypto');\nconst child = require('child_process');\nconst encoded = [1, 2, 3, 4, 5, 6].map(\n\t(n) => fs.readFileSync('.github/flow-followup.part' + n, 'utf8')\n).join('');\nif (encoded.length !== 13284) {\n\tthrow new Error('Unexpected bundle length: ' + encoded.length);\n}\nconst patch = zlib.brotliDecompressSync(Buffer.from(encoded, 'base64'));\nconst actual = crypto.createHash('sha256').update(patch).digest('hex');\nif (actual !== '21ca6b095482248c8cb2e38ad8b24309108a482af2066280d477f02a221e62ff') {\n\tthrow new Error('Patch checksum mismatch: ' + actual);\n}\nchild.execFileSync('git', ['apply', '--check', '-'], { input: patch, stdio: ['pipe', 'inherit', 'inherit'] });\nchild.execFileSync('git', ['apply', '-'], { input: patch, stdio: ['pipe', 'inherit', 'inherit'] });\nconsole.log('Applied SHA-256 verified patch (' + patch.length + ' bytes)');\nJS"
				},
				{
					"name": "Run targeted PHP and JavaScript smoke tests",
					"run": "set -eu\nphp -r 'if (!class_exists(\"DOMDocument\")) { throw new RuntimeException(\"ext-dom missing\"); }'\nphp -l extensions/Flow/includes/Block/TopicListBlock.php\nphp -l extensions/Flow/includes/Formatter/RevisionFormatter.php\nphp -l extensions/Flow/includes/Parsoid/ContentFixer.php\nphp -l extensions/Flow/includes/Parsoid/Fixer/WikiLinkFixer.php\nphp extensions/Flow/tests/smoke/FlowCacheTest.php\nphp extensions/Flow/tests/smoke/FlowFormatterOptimizationTest.php\nphp extensions/Flow/tests/smoke/FlowContentFixerTest.php\nnode --check extensions/Flow/modules/flow/dm/mw.flow.dm.System.js\nnode --check extensions/Flow/modules/flow/dm/api/mw.flow.dm.APIHandler.js\nnode extensions/Flow/tests/smoke/flow-loadmore.test.js\nnode extensions/Flow/tests/smoke/flow-pagination.test.js\nPYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s extensions/Flow/tests/smoke -p 'test_*.py' -v"
				},
				{
					"name": "Publish tested Flow changes without workflow modification",
					"run": "set -eu\nrm .github/flow-followup.part1 .github/flow-followup.part2 .github/flow-followup.part3 .github/flow-followup.part4 .github/flow-followup.part5 .github/flow-followup.part6\ngit add -A extensions/Flow\ngit add -u .github\ngit diff --cached --check\ngit config user.name 'github-actions[bot]'\ngit config user.email '41898282+github-actions[bot]@users.noreply.github.com'\ngit commit -m \"Flow: fix ToC pagination, preload wikilinks and reuse render data\"\ngit push origin HEAD:refs/heads/fix/flow-followup-no-lazy-20261121"
				}
			]
		}
	}
}
